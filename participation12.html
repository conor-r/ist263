<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial scale=1.0">
    <title>Participation 12</title>
    <script>
        function OrangeNation () {
            document.getElementById("su").innerHTML = "Orange Nation"
        }
        function colorChange () {
            document.getElementById("su").style.color = "orange"
        }
    </script>
</head>

<body>
    <h1>Click to Change Text</h1>
    <div onclick="OrangeNation(); colorChange()" id="su">Syracuse University</div>
</body>

</html>
