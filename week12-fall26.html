<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial scale=1.0">
    <title>More Javascript</title>
        <script>
            function wrongAnswer () {
                document.getElementById("wrong").innerHTML = "<span style='color: red;'>True is the wrong answer!</span>"
            }
            function rightAnswer () {
                document.getElementById("correct").innerHTML = "<span style='color: green;'>False is the right answer!</span>"
            }
            function change () {
                document.getElementById("arrow").setAttribute("src", "https://peopel-se.github.io/ist263/images/arrow_over.png")
            }
            function changeBack  () {
                document.getElementById("arrow").setAttribute("src", "https://peopel-se.github.io/ist263/images/arrow.png")
            }
        </script>

</head>

<body>
    <h1>My JavaScript Quiz</h1>
    <p>Java and JavaScript are the same thing.</p>
    <p onclick="wrongAnswer();" id="wrong">True</p>
    <p onclick="rightAnswer()" id="correct">False</p>
    <img src="https://peopel-se.github.io/ist263/images/arrow.png" alt="arrow icon" onmouseover="change()">
</body>

</html>
